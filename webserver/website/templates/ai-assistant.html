<!DOCTYPE html>
<html lang="en">

<head>
    <title>AI Assistant Page</title>
    <meta charset="UTF-8">

    <!-- this path is for the flask app -->
        <link rel="stylesheet" href="/static/css/ai-assistant.css">
        <!-- <link rel="shortcut icon" href="/static/icons/ai-assistant.ico"> -->

        <!-- if the scripts are defined before the elements they access, you get NULL errors -->
        <!-- use the keyword 'defer' to prevent this NULL error -->
        <script src="/static/js/ai-assistant.js" defer></script>

    <!-- this path is for debugging locally -->
        <!-- <link rel="stylesheet" href="../static/css/ai-assistant.css"> -->
        <!-- <script src="../static/js/ai-assistant.js" defer></script> -->

    <!-- define external scripts -->
    <!-- <script src="/static/js/external/marked.min.js"></script> -->
    <!-- <script src="/static/js/external/mathjax.min.js" async></script> -->

    <!-- <script>
        window.MathJax = {
            tex: {
            // This tells MathJax to treat [ ] as display math delimiters
            displayMath: [['$$', '$$'], ['\\[', '\\]'], ['[', ']']],
            inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script> -->

</head>



<body>

    <!-- define the overlay that is displayed when a file is being dragged into the page -->
    <div id="overlay" class="overlay"></div>



    <div class="side-panel">
        <!-- Side Panel -->

        <div id="side-panel-buttons-container" class="side-panel-buttons-container">
            <div style="width: 100%; height: fit-content; color: transparent">
                Hello :)
            </div>

            <button class="side-panel-buttons" onclick="openSearch()">Search</button>
            <button class="side-panel-buttons" onclick="openNewChat()">New Chat</button>
            <button class="side-panel-buttons" onclick="listPreviousChats()">Chats</button>

            <!-- this container will hold the list of previous chats (display is toggled by 'Chats' button) -->
            <div id="chat-history-container" class="chat-history-container">

            </div>

            <!-- <button class="side-panel-buttons" onclick="openFileGallery()">Files</button> -->
        </div>

    </div>

    <div class="top-panel">
        <div class="login-button-container">
            <a id="login-button-link" href="{{ url_for('login.openChatBotLoginPage') }}">
                <button id="login-button" class="login-button">Login</button>
            </a>
            <a id="logout-button-link" href="{{ url_for('login.logoutUser') }}">
                <!-- logout button uses same css as login button, so the class is the same -->
                <!-- hide logout button unless user is logged in -->
                <button id="logout-button" class="login-button" style="display: none;">Logout</button>
            </a>
        </div>
    </div>
    
    <!-- also define the main-panel to act as the file dropbox location -->
    <div class="main-panel" id="dropbox">

        <!-- this container holds all of the user and LLM text -->
        <div id="current-chat-container" class="current-chat-container">
            <!-- <div id="loaded-chat-name" style="display: none; font-size: 0;">newchat</div> -->
        </div>

        <h1 id="initial-greeting" style="font-family: Arial, Helvetica, sans-serif; font-weight: normal; text-align: center;">Whats on your mind?</h1>

        <div class="input-box-container">

            <!-- this holds the 'TXT', 'PDF', etc. icons when a user uploads files that are yet to be sent -->
            <div id="file-upload-icons-container" class="file-upload-icons-container">
                <!-- The following 3 paragaph tags were used for testing/development -->
                <!-- <p class="file-icon">TXT</p>
                <p class="file-icon">TXT</p>
                <p class="file-icon">PDF</p> -->
                <button id="file-icon-clear-button" class="file-icon" style="display:none" onclick="clearFileUploads()">X</button>
            </div>

            <!-- textarea goes first into the input box container -->
            <textarea id="input-box" class="input-box" placeholder="Ask anything" rows="1"></textarea>

            <!-- then place the button controls, wrapped into another control container -->
            <div class="input-controls-container">
                <!-- by separating class with whitespace, we can apply multiple classes to a single element -->
                <!-- the following buttons inherit styles from both control-button and their respective other classes -->

                <!-- agentic/chatbot mode -->
                <div id="agentic-mode-toggle-container" class="agentic-mode-toggle-container">
                    <p class="agentic-mode-header">Agent Mode</p>
                    <button id="agentic-mode-button" class="agentic-mode-button" onclick="updateSlider()">
                        <input type="checkbox" id="agentic-mode-toggle-checkbox" class="agentic-mode-toggle-checkbox">
                    </button>
                </div>


                <!-- file upload -->
                <!-- <form> -->
                <input id="upload-file-input" type="file" class="control-button upload-file" style="display: none;" onchange="prepareUploadFile(this)" multiple>
                <button id="upload-file-btn" type="submit" class="control-button upload-file" onclick="triggerFilePicker()">+</button>
                <!-- </form> --> 

                <!-- model select -->
                <div class="model-select-container">
                    <button id="select-model-btn" class="control-button model-select" onclick="toggleSelectModelDropdown(event)">
                        <span id="current-model-text">qwen2.5:14b-instruct</span>
                        <span class="arrow" style="font-weight: bold;">&#8744;</span>
                    </button>

                    <div id="model-dropdown" class="model-dropdown">
                        <!-- The following are examples of the elements that will be automatically added from the toggleSelectModelDropdown() function in the javascript file -->
                        <!-- <div class="model-dropdown-item" onclick="selectModel('deepseek-r1:14b')">deepseek-r1:14b</div>
                        <div class="model-dropdown-item" onclick="selectModel('qwen3.6:36b-a3b')">qwen3.6:36b-a3b</div>
                        <div class="model-dropdown-item" onclick="selectModel('llama3.3:latest')">llama3.3:latest</div>
                        <div class="model-dropdown-item" onclick="selectModel('mistral:7b')">mistral:7b</div>
                        <div class="model-dropdown-item" onclick="selectModel('phi3:mini')">phi3:mini</div> -->
                    </div>
                </div>

                <!-- text upload -->
                <button id="upload-text-btn" class="control-button upload-text" onclick="uploadText()">↑</button>
            </div>


        </div>
    </div>




</body>

</html>
