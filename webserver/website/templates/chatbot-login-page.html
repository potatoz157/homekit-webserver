<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chatbot Login Page</title>
    
    <link rel="stylesheet" href="/static/css/chatbot-login-page.css">

    <!-- if the scripts are defined before the elements they access, you get NULL errors -->
    <!-- use the keyword 'defer' to prevent this NULL error -->
    <script src="/static/js/chatbot-login-page.js" defer></script>

</head>



<body>

    <div class="login-container">
        <a href="/chatbot" class="back-button">Back to Chatbot</a>
        <h2 style="color: white; margin-top: 0; padding-top: 0; margin-bottom: 5%">Sign In</h2>
        <!-- the form itself does not have any CSS, i.e. nothing is defined for tags with #login-form ID  -->
        <form id="login-form"  action="/chatbot/login-validation" method="POST">
            <div class="input-group">
                <label for="username">
                    <p>
                        Username
                    </p>
                </label>
                <input type="text" id="username" name="username" required autocomplete="off">
            </div>
    
            <div class="input-group">
                <label for="password">
                    <p>
                        Password
                    </p>
                </label>
                <input type="password" id="password" name="password" required>
            </div>

            <div id="login-error-message" class="input-field-error-msg" style="margin: 0; padding: 0;">* username or password is incorrect</div>

            <button type="submit" class="login-btn">Log In</button>
        </form>
        <a href="/chatbot/register" class="login-register-redirect">Don't have an account? Sign Up!</a>
    </div>


</body>

</html>
